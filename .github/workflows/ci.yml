name: Go Build
jobs:
  test:
    name: Run tests
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ./go.mod
    - name: Run tests
      run: go test -v ./...
    - name: Check for modernization opportunities
      run: |
        go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest ./...
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v21
    - name: Check Formatting
      run: nix flake check
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
    paths-ignore:
    - data/patterns/**
    - '**/*.md'
  pull_request:
    branches:
    - main
    paths-ignore:
    - data/patterns/**
    - '**/*.md'
